<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;min-width:320px;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;width:100%;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">

          <tr>
            <td style="background-image:linear-gradient(160deg,{{ primary_color }} 0%,{{ primary_color }}cc 60%,{{ primary_color }}88 100%);background-color:{{ primary_color }};padding:22px 32px 16px;text-align:center;">

              {% if logo_url %}
              <img src="{{ logo_url }}" alt="{{ app_title }}"
                   style="height:60px;width:60px;object-fit:cover;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto;border:0;border-radius:50%;box-shadow:0 4px 16px rgba(0,0,0,0.25);background-color:rgba(255,255,255,0.15);">
              {% endif %}

              <div style="margin-bottom:4px;">
                <span style="color:#ffffff;font-size:22px;font-weight:bold;letter-spacing:0.5px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,0.2);">
                  {{ app_title }}
                </span>
              </div>

              <div style="width:48px;height:2px;background:rgba(255,255,255,0.5);margin:10px auto 0;border-radius:2px;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 40px 24px;color:#374151;font-size:15px;line-height:1.75;word-break:break-word;">
              {{ body|linebreaks }}
            </td>
          </tr>

          {% if doc_url %}
          <tr>
            <td style="padding:8px 40px 36px;text-align:center;">
              <a href="{{ doc_url }}"
                 style="display:inline-block;padding:13px 32px;background-color:{{ primary_color }};color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;font-size:14px;letter-spacing:0.3px;mso-padding-alt:0;line-height:normal;">
                View Document &#8594;
              </a>
            </td>
          </tr>
          {% endif %}

          <tr>
            <td style="background-color:#f9fafb;padding:16px 40px;text-align:center;border-top:1px solid #e5e7eb;">
              <span style="color:#9ca3af;font-size:12px;line-height:1.5;">
                {{ app_title }} &mdash; Automated notification. Do not reply to this email.
              </span>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
